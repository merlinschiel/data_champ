config: sensor
sensor_info:
  name: '01'
  country: Germany
  identifier: A102
  install_date: 2016-10-21
  latitude: 52.4664
  longitude: 12.9592
  elevation: 40
  time_zone: 0
  site_cutoff_rigidity: 2.72
  avg_lattice_water: 0.0074
  avg_soil_organic_carbon: 0.0285
  avg_dry_soil_bulk_density: 1.3949
  above_ground_biomass: 0.0
  N0: 4678
  beta_coefficient: null
  mean_pressure: 1013.25
  location: MQ1
time_series_data:
  path_to_data: null
  key_column_info:
    epithermal_neutron_columns:
    - N1
    - N2
    thermal_neutrons: null
    neutron_count_units: absolute_count
    pressure_columns:
    - Internal_press
    pressure_units: hectopascals
    pressure_merge_method: priority
    temperature_columns:
    - Internal_t
    temperature_units: celcius
    temperature_merge_method: priority
    relative_humidity_columns:
    - Internal_rh
    relative_humidity_units: percent
    relative_humidity_merge_method: priority
    date_time_columns:
    - Date_Time
    date_time_format: '%Y/%m/%d %H:%M:%S'
    initial_time_zone: utc
    convert_time_zone_to: utc
raw_data_parse_options:
  parse_raw_data: true
  data_location: null
  column_names:
  - RecordNum
  - Date_Time
  - Internal_press
  - Internal_t
  - Internal_rh
  - Battery_v
  - N1
  - N1ET
  - N2
  - N2ET
  - sdi_adr0
  - PR2.6_10cm
  - PR2.6_20cm
  - PR2.6_30cm
  - PR2.6_40cm
  - PR2.6_60cm
  - PR2.6_100cm
  - SDI_adr1
  - SMT1_raw
  - SMT1_permittivity
  - SMT1_vwc
  - SMT1_soiltemp
  - SMT1_v
  - SDI_adr2
  - SMT2_raw
  - SMT2_permittivity
  - SMT2_vwc
  - SMT2_soiltemp
  - SMT2_v
  prefix:
  - '*Data*'
  - '*'
  suffix:
  - .txt
  - .00*
  encoding: cp850
  skip_lines: 0
  separator: ','
  decimal: .
  skip_initial_space: true
  parser_kw:
    strip_left: true
    digit_first: true
  starts_with: ''
  multi_header: false
  strip_names: true
  remove_prefix: //
input_data_qa:
  air_relative_humidity:
    flag_range:
      min: 0
      max: 100
  air_pressure:
    flag_range:
      min: 600
      max: 1300
  temperature:
    flag_range:
      min: -40
      max: 60
neutron_quality_assessment:
  raw_neutrons:
    flag_range:
      min: 500
      max: 6000
soil_moisture_qa:
  soil_moisture:
    flag_range:
      min: 0
      max: 1
calibration:
  calibrate: false
  data_format: custom
  location: processing/calibration/data/calibration_01.csv
  key_column_names:
    date_time: DateTime_utc
    profile_id: Profile_ID
    sample_depth: Profile_Depth_cm
    radial_distance_from_sensor: Distance_to_CRNS_m
    gravimetric_soil_moisture: SoilMoisture_g_g
    bulk_density_of_sample: DryBulkDensity_g_cm3
    soil_organic_carbon: SoilOrganicCarbon_g_g
    lattice_water: LatticeWater_g_g
data_storage:
  save_folder: null
  append_yaml_hash_to_folder_name: false
  create_report: true
figures:
  create_figures: true
  make_all_figures: true
  custom_list:
  - nmdb_incoming_radiation
