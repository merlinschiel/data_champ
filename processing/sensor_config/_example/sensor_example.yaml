# ============================================================================
# EXAMPLE SENSOR CONFIG Showcasing Special YAML Features
# ============================================================================
# The YAMLs are neptoon (>= 1.2) sensor configs. Framework-only keys
# (sensor_info.location, supplementary_files, raw_data_parse_options.time_shift)
# are removed automatically before a YAML is handed to neptoon.

config: sensor

# --------------------------------------------------------------------------
# 1. SENSOR INFO
# --------------------------------------------------------------------------
sensor_info:
  name: 'example'
  country: Germany
  identifier: EXAMPLE_01
  install_date: 2024-01-15
  latitude: 51.0504
  longitude: 13.7373
  elevation: 113
  time_zone: 0
  site_cutoff_rigidity: 2.94
  avg_lattice_water: 0.012
  avg_soil_organic_carbon: 0.035
  avg_dry_soil_bulk_density: 1.42
  above_ground_biomass: 2.0
  N0: 3200
  # Optional: N0 per conversion method; the one matching the process config's
  # soil_moisture_estimation.method is used instead of N0.
  # N0_desilets_etal_2010: 3200
  # N0_koehli_etal_2021: 3350
  beta_coefficient: null
  mean_pressure: null
  location: ExampleSite

# --------------------------------------------------------------------------
# 2. TIME SERIES DATA
# --------------------------------------------------------------------------
time_series_data:
  path_to_data: null
  key_column_info:
    epithermal_neutron_columns:
      - N1
    thermal_neutrons:               # list of columns, or null if there is no thermal tube
      - N2
    neutron_count_units: absolute_count
    pressure_columns:
      - Internal_press
    pressure_units: hectopascals
    pressure_merge_method: priority
    temperature_columns:
      - Internal_t
    temperature_units: celcius
    temperature_merge_method: priority
    relative_humidity_columns:
      - Internal_rh
    relative_humidity_units: percent
    relative_humidity_merge_method: priority
    date_time_columns:
      - Date_Time
    date_time_format: '%Y/%m/%d %H:%M:%S'
    initial_time_zone: utc
    convert_time_zone_to: utc

# --------------------------------------------------------------------------
# 3. RAW DATA PARSE OPTIONS
# --------------------------------------------------------------------------
raw_data_parse_options:
  parse_raw_data: true
  data_location: null

  column_names:
    - RecordNum
    - Date_Time
    - Internal_press
    - Internal_t
    - Internal_rh
    - Battery_v
    - N1
    - N1ET
    - N2
    - N2ET

  # Raw file selection (neptoon 1.2): prefix/suffix are single strings
  # (startswith/endswith, or glob patterns when they contain * ? [ ]);
  # filename_include_regex / filename_exclude_regex are matched with re.search.
  # Here: files like *Data*.txt or logger files ending in .00x
  filename_include_regex: '(?i)data.*\.txt$|\.0\d*$'
  # prefix: ''
  # suffix: '.txt'
  # filename_exclude_regex: ''

  encoding: cp850
  skip_lines: 0
  separator: ','
  decimal: .
  skip_initial_space: true
  parser_kw:
    strip_left: true
    digit_first: true
  starts_with: ''
  multi_header: false
  strip_names: true
  remove_prefix: //

  # ---- TIME SHIFT --------------------------------------------------------
  # Corrects broken or missing timestamps during merge.
  # Supported modes:
  #
  #   offset              — Shift all timestamps by a fixed delta.
  #   align_start          — Shift so the earliest timestamp matches target_start.
  #   reconstruct_sequence — Generate new timestamps from start_date + interval
  #     (also: linear_sequence, interval — all behave the same)
  #
  # Only ONE mode should be active at a time; comment out the others.
  # --------------------------------------------------------------------------

  # --- Example A: fixed offset (shift +2 hours) ---
  # time_shift:
  #   enabled: true
  #   mode: offset
  #   offset: '2h'              # pandas Timedelta string
  #   # Alternatively, specify components:
  #   # hours: 2
  #   # minutes: 30

  # --- Example B: align the first timestamp to a known date ---
  # time_shift:
  #   enabled: true
  #   mode: align_start
  #   target_start: '2024-01-15T12:00:00Z'

  # --- Example C: reconstruct timestamps from scratch ---
  time_shift:
    enabled: true
    mode: reconstruct_sequence
    start_date: '2024-01-15T12:00:00Z'
    interval: '20min'           # generates ts at 12:00, 12:20, 12:40, …

# --------------------------------------------------------------------------
# 4. SUPPLEMENTARY FILES — secondary detectors & profile sensors
# --------------------------------------------------------------------------
# After the main data is merged, these files are joined on the datetime axis.
# Each entry describes a separate file (or glob pattern) living alongside
# the main data files.
supplementary_files:

  # ---- 4a. SECONDARY DETECTOR -------------------------------------------
  - type: secondary_detector
    file_prefix: 'SecDet_'
    file_suffix: '.txt'
    column_operations:
      - source_column: column1
        operation: sum
      - source_column: column2
        operation: sum


  # ---- 4b. FIELD PROBE DATA (e.g. external TDR installed nearby) ---------
  # Similar to profile_data but uses a sibling subfolder for the raw files.
  - type: field_probe_data
    file_prefix: 'TDR_'
    file_suffix: '.dat'
    data_subfolder: tdr_probe     # looks in  <phase_dir>/tdr_probe/
    column_prefix: TDR
    datetime_column: 'Date Time(UTC)'
    datetime_format: '%d.%m.%Y %H:%M:%S'
    column_names:
      - 'Date Time(UTC)'
      - sm_10cm
      - sm_30cm
      - temp_10cm
      - temp_30cm
    separator: "\t"
    decimal: ','
    skip_lines: 2
    encoding: utf-8
    resample: '20min'
    resample_method: mean

# --------------------------------------------------------------------------
# 5. INPUT DATA QA  (range checks applied before neptoon processing)
# --------------------------------------------------------------------------
input_data_qa:
  air_relative_humidity:
    flag_range: { min: 0, max: 100 }
  air_pressure:
    flag_range: { min: 600, max: 1300 }
  temperature:
    flag_range: { min: -40, max: 60 }

# Sensor-specific raw neutron range (cph); count rates differ per sensor, so
# this lives here and not in the process config.
neutron_quality_assessment:
  raw_neutrons:
    flag_range: { min: 200, max: 8000 }

soil_moisture_qa:
  soil_moisture:
    flag_range: { min: 0, max: 1 }

# --------------------------------------------------------------------------
# 6. CALIBRATION
# --------------------------------------------------------------------------
# Sample data is read from data/.calibration/calibration_<sensor>.csv
# (or --campaign <csv>); key_column_names maps neptoon keys to its columns.
calibration:
  calibrate: false
  data_format: custom
  location: null
  key_column_names:
    date_time: DateTime_utc
    profile_id_column: Profile_ID
    sample_depth: Profile_Depth_cm
    radial_distance_from_sensor: Distance_to_CRNS_m
    gravimetric_soil_moisture: SoilMoisture_g_g
    bulk_density_of_sample: DryBulkDensity_g_cm3
    soil_organic_carbon: SoilOrganicCarbon_g_g
    lattice_water: LatticeWater_g_g

# --------------------------------------------------------------------------
# 7. OUTPUT SETTINGS
# --------------------------------------------------------------------------
data_storage:
  save_folder: null
  append_yaml_hash_to_folder_name: false
  create_report: true

figures:
  create_figures: true
  make_all_figures: true
  custom_list:
    - nmdb_incoming_radiation
